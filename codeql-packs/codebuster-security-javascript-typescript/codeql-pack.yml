name: codebuster/security-js
version: 0.0.1
libraryPathDependencies: codeql/javascript-all

dataExtensions:
  - ext/*.qls

defaultSuite:
  description: "CodeBuster deep security queries for JavaScript/TypeScript"
  queries:
    # Include standard security queries
    - uses: codeql/javascript-queries@latest
      with:
        include:
          - security
          - security-and-quality
    # Include any custom queries in ./queries
    - from: ./queries
      where: "true"

