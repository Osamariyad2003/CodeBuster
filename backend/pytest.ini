[pytest]
; Some test modules import via the package path (e.g. `from backend.services...`),
; others import as if `backend/` itself is on sys.path (e.g. `from main import app`,
; `from models.schemas import ...`). Put both `backend/` (".") and its parent (repo
; root, "..") on sys.path so either style resolves, and so `pytest` works the same
; whether it's invoked from the repo root or from inside `backend/`.
pythonpath = . ..
testpaths = tests
