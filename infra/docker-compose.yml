# CodeBuster local dev: Postgres, Redis, MinIO, SonarQube, FastAPI backend, Celery worker, React frontend
version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codebuster
      POSTGRES_PASSWORD: codebuster_pass
      POSTGRES_DB: codebuster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebuster"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - codebuster-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codebuster-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codebuster
      MINIO_ROOT_PASSWORD: codebuster_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - codebuster-net

  sonarqube:
    image: sonarqube:10-community
    ports:
      - "9200:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: codebuster
      SONAR_JDBC_PASSWORD: codebuster_pass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - codebuster-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg2://codebuster:codebuster_pass@db:5432/codebuster
      REDIS_URL: redis://redis:6379/0
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: codebuster
      S3_SECRET_KEY: codebuster_pass
      S3_BUCKET: codebuster-artifacts
      ENVIRONMENT: development
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_PROJECT_KEY: ${SONARQUBE_PROJECT_KEY:-codebuster}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - codebuster-net

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://codebuster:codebuster_pass@db:5432/codebuster
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: codebuster
      S3_SECRET_KEY: codebuster_pass
      S3_BUCKET: codebuster-artifacts
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      SONARQUBE_PROJECT_KEY: ${SONARQUBE_PROJECT_KEY:-codebuster}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codebuster-net

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - codebuster-net

networks:
  codebuster-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
